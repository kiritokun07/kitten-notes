<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小猫便签</title>
  <link rel="stylesheet" href="panel.css">
  <script src="vendor/markdown-it-15.0.3.min.js" defer></script>
  <script src="vendor/fflate-0.8.3.min.js" defer></script>
  <script src="export.js" defer></script>
  <script src="panel.js" defer></script>
</head>
<body>
  <header><h1>小猫便签</h1><nav>
    <button id="historyToggle" class="secondary">全部便签</button>
    <button id="create">＋ 新建</button>
  </nav></header>
  <main id="workspace" inert>
    <div class="note-heading">
      <input id="title" aria-label="便签标题" placeholder="标题（选填）" autocomplete="off">
      <button id="previewMode" class="secondary" aria-pressed="false">预览</button>
    </div>
    <textarea id="body" aria-label="便签正文" placeholder="写点什么，或从网页选中文字存到这里…"></textarea>
    <article id="preview" aria-label="Markdown 预览" hidden></article>
  </main>
  <main id="history" hidden>
    <input id="search" type="search" aria-label="搜索便签" placeholder="搜索标题或正文">
    <ul id="results"></ul>
    <p id="noResults" hidden></p>
  </main>
  <dialog id="actionDialog" aria-labelledby="actionHeading">
    <h2 id="actionHeading">删除便签？</h2>
    <p id="actionText"></p>
    <div class="actions"><button id="cancelDelete" class="secondary" autofocus>取消</button>
      <button id="confirmAction">删除</button></div>
  </dialog>
  <footer><span id="status" role="status" aria-live="polite"></span>
    <button id="downloadZip" class="secondary" disabled>导出全部便签</button></footer>
</body>
</html>
